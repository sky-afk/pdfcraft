# Minimal fork of the upstream Release pipeline: builds ONLY the Windows x64 installer,
# with the Simplified-Chinese-only craft-fonts branch embedded (fixes the tofu/□ UI bug).
# The signing steps are kept but skipped automatically (no secrets on this fork).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PDFCRAFT_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
          } >>"$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      # Simplified-Chinese-only font set (Noto Sans CJK SC, OFL-1.1).
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sky-afk/craft-fonts
          ref: zh-only
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$PDFCRAFT_VERSION"
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build, sign, package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      # Simplified-Chinese-only font set (Noto Sans CJK SC, OFL-1.1).
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sky-afk/craft-fonts
          ref: zh-only
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$PDFCRAFT_VERSION"
      # No APPLE_CERTIFICATE secret on this fork: import-cert.sh warns and exits 0,
      # so package.sh falls back to ad-hoc signing and skips notarization.
      - name: Import signing certificate
        shell: bash
        run: packaging/macos/import-cert.sh
      - name: Build, sign, package
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${PDFCRAFT_VERSION}-zh"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi
          gh release create "$tag" release-assets/* \
            --target main \
            --title "PdfCraft ${PDFCRAFT_VERSION} 简体中文界面修复版 (Windows x64 / macOS universal)" \
            --notes-file RELEASE-NOTES-zh.md
